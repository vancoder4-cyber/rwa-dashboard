name: RWA Data Health

on:
  schedule:
    - cron: '20 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rwa-data-health
  cancel-in-progress: false

jobs:
  production-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Contract tests
        run: npm test

      - name: Inline JavaScript syntax
        run: npm run check:inline

      - name: Production data contracts
        run: npm run audit:data

      - name: Competitor listing review
        if: ${{ always() }}
        run: npm run audit:listings

      - name: Production health endpoint
        if: ${{ always() }}
        run: npm run audit:health
