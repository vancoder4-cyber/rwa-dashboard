name: Production deployment guard

on:
  schedule:
    - cron: '0,15,30,45 * * * *'
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rwa-production-deployment-guard
  cancel-in-progress: false

jobs:
  verify-production:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       (github.event.deployment.environment == 'Production' ||
        contains(github.event.deployment_status.environment_url, 'avenir-rwa-analyst.vercel.app')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify Git, Vercel, runtime and published artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npm run audit:deployment
